name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pyyaml
      - run: ruff check --select E9,F63,F7 .
      - run: python -m compileall -q .
      - run: python -m pytest -q tests
